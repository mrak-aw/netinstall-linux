[config]
version_check = false

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-3.0/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-4.0/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.kde]
input_path = "~/.config/matugen/templates/kde/breeze.colors"
output_path = "~/.local/share/color-schemes/matugen.colors"

[templates.kdeglobals]
input_path = '~/.config/matugen/templates/kde/breeze.colors'
output_path = '~/.config/kdeglobals'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6ct.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qt5ct.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprland/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors.conf'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = "hyprctl reload"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync/colors.css"
output_path = "~/.config/swaync/colors.css"
post_hook = "pkill swaync; swaync & disown"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar/colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar"

[templates.wofi]
input_path = "~/.config/matugen/templates/wofi/style.css"
output_path = "~/.config/wofi/style.css"

[templates.wofi-wallpaper-switcher]
input_path = "~/.config/matugen/templates/wofi/wallpaper-switcher.css"
output_path = "~/.config/wofi/wallpaper-switcher/style.css"

[templates.foot]
input_path = "~/.config/matugen/templates/foot/colors.ini"
output_path = "~/.config/foot/colors.ini"

